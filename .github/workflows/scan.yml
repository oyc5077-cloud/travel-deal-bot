name: Travel Deal Scan

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 가격 수집 + 리포트 생성 실행
        run: python main.py

      - name: 변경사항 커밋
        run: |
          git config user.name "travel-deal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add price_history.db docs/index.html
          git diff --cached --quiet || git commit -m "auto: 가격 스캔 결과 갱신"
          git push
